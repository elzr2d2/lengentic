packages:
  - 'platform/*'
  - 'playground'
# Postinstall scripts are opt-in under pnpm 10+. Each entry below is a native binary
# resolver — without them the tool is installed but cannot run.
allowBuilds:
  # tsx -> esbuild. Resolves the platform-specific binary; `pnpm spike` fails without it.
  esbuild: true
  # Vitest transforms NestJS decorators through SWC, which ships a native binary.
  '@swc/core': true
  # Prisma CLI and query engine.
  prisma: true
  '@prisma/engines': true
  # Testcontainers transitives. All three postinstalls are optional native accelerations
  # for the Docker-over-SSH transport, which we do not use — the local daemon socket needs
  # none of them. Declined rather than left unanswered so `pnpm install` stays quiet.
  cpu-features: false
  protobufjs: false
  ssh2: false
minimumReleaseAgeExclude:
  - '@nestjs/common@11.2.1'
  - '@nestjs/core@11.2.1'
  - '@nestjs/platform-express@11.2.1'
  - '@nestjs/testing@11.2.1'
  - '@next/env@16.3.1'
  - '@next/swc-darwin-arm64@16.3.1'
  - '@next/swc-darwin-x64@16.3.1'
  - '@next/swc-linux-arm64-gnu@16.3.1'
  - '@next/swc-linux-arm64-musl@16.3.1'
  - '@next/swc-linux-x64-gnu@16.3.1'
  - '@next/swc-linux-x64-musl@16.3.1'
  - '@next/swc-win32-arm64-msvc@16.3.1'
  - '@next/swc-win32-x64-msvc@16.3.1'
  - next@16.3.1

# `spike/` is deliberately NOT a workspace package. It is disposable Phase 0 scaffolding
# (MVP_PLAN.md §13) and is deleted at the end of Phase 5. Keeping it out of the workspace
# means removing it is `rm -rf spike/` and nothing else.
