name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Integration tests point Testcontainers at their own database; this value only has to
  # satisfy env validation at module load.
  DATABASE_URL: postgresql://lengentic:lengentic@localhost:5432/lengentic?schema=public

jobs:
  gates:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history: check:lanes scenario 40 validates `changed_files` against a fixed
      # historical commit, which a depth-1 clone does not have.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Workspace packages resolve each other through built `dist/`, which a clean checkout
      # lacks: lint, typecheck and test all fail on it (TS2307 @lengentic/shared). Build first.
      - name: Build workspace
        run: pnpm build

      # Run every gate even when an earlier one fails. A run that stops at lint tells you
      # nothing about whether the tests pass, which turns one fix into two round trips.
      - if: '!cancelled()'
        run: pnpm lint
      - if: '!cancelled()'
        run: pnpm format:check
      - if: '!cancelled()'
        run: pnpm typecheck
      - if: '!cancelled()'
        run: pnpm test

      - name: Architectural boundaries
        if: '!cancelled()'
        run: pnpm check:boundaries

      # QA-integrity scan: false green, focused tests, hidden skips. Part of `pnpm gates`
      # locally, so CI runs it too rather than letting the two tiers drift apart.
      - name: QA integrity
        if: '!cancelled()'
        run: pnpm check:integrity

      # The dispatch rules' own scenarios — eligibility gate, path ownership, handoff
      # validation, integration order, and the PreToolUse hook run as a real process.
      # Deliberately outside `pnpm gates`: it reads `.claude/`, and the product gate has to
      # keep working with the engineering harness deleted (MVP_PLAN_V3.md §9).
      - name: Lane workflow scenarios
        if: '!cancelled()'
        run: pnpm check:lanes

      # The control plane's own scenarios — `pnpm flow next` action derivation, gate
      # records, checkpoint reconciliation. Outside `pnpm gates` for the same reason.
      - name: Flow scenarios
        if: '!cancelled()'
        run: pnpm check:flow

      # The session supervisor's own scenarios: the progression invariant's false-green
      # cases, and crash / rotation / repair-exhaustion / duplicate-ownership driven against
      # a real child process. Outside `pnpm gates` for the same reason as the two above.
      - name: Autopilot supervisor scenarios
        if: '!cancelled()'
        run: pnpm check:autopilot

      # Probe hygiene: a probe may only look inside the surface its own node owns
      # (CLAUDE.md "The oracle must not lie").
      - name: Probe ownership
        if: '!cancelled()'
        run: pnpm check:probes

      # The sequential-vs-parallel decision engine's own scenarios.
      - name: Decide scenarios
        if: '!cancelled()'
        run: pnpm check:decide

      # The retriever's own scenarios. Same reason as above for being outside `pnpm gates`.
      # It also catches document rot: a renumbered plan section or a renamed glossary term
      # breaks `pnpm kb show §19` here rather than in the middle of a session.
      - name: Knowledge-base scenarios
        if: '!cancelled()'
        run: pnpm check:kb

      # MVP_PLAN.md §17. Slow — a full install/build/test in a temp checkout with
      # playground/ removed — which is why it lives here and in `pnpm gates:full` rather
      # than in `pnpm gates` (corrections doc §9).
      - name: Isolation
        if: '!cancelled()'
        run: pnpm check:isolation

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No build step here on purpose. What this job has to compile is a property of the
      # tests, not of the workflow, so it is declared once — `pretest:integration` in
      # `platform/api/package.json` — and pnpm runs it ahead of the suite here and on a
      # developer's machine alike. A build step listed only in CI rots silently: the suite
      # keeps passing locally off a `dist/` some earlier `pnpm build` left behind, and the
      # first anyone hears of the gap is a red CI run. That is exactly how the SDK import in
      # `test/stale-on-kill/fixtures/*.ts` — resolved by a spawned `node --import tsx` child,
      # outside vitest, so no alias rescues it — reached `main` unbuilt by this job. The same
      # hook builds the SDK the E2E suite's spawned Playground CLIs import (and the E2E
      # suite's own `beforeAll` rebuilds it, so a cold checkout cannot reach the CLIs unbuilt).
      #
      # Testcontainers starts its own PostgreSQL. GitHub runners ship a Docker daemon, so
      # this is the job that actually exercises the database path.
      #
      # Integration and E2E are separate steps so a red E2E is never hidden inside a red
      # integration run (or the reverse). Both use the `verbose` reporter for the console
      # and `junit` for the uploaded report, which names every test individually.
      - name: Integration tests (all but E2E)
        run: >-
          pnpm --filter @lengentic/api test:integration
          --exclude '**/e2e.integration.spec.ts'
          --reporter=verbose --reporter=junit
          --outputFile.junit=${{ github.workspace }}/test-reports/integration.junit.xml

      # E2E 1-4: real Playground CLI -> SDK -> API -> PostgreSQL -> analysis. The spec spawns
      # `pnpm exec tsx playground/...` as child processes, which import the SDK's built entry.
      - name: E2E tests (E2E 1-4)
        if: '!cancelled()'
        run: >-
          pnpm --filter @lengentic/api test:integration e2e.integration
          --reporter=verbose --reporter=junit
          --outputFile.junit=${{ github.workspace }}/test-reports/e2e.junit.xml

      # A skipped or filtered-out flow reads as a green run, so assert all four are reported
      # and that none of them is a skipped testcase.
      - name: Assert all four E2E flows were reported
        if: '!cancelled()'
        run: |
          for n in 1 2 3 4; do
            if ! grep -q "E2E $n:" test-reports/e2e.junit.xml; then
              echo "::error::E2E $n missing from test-reports/e2e.junit.xml"
              exit 1
            fi
          done
          if grep -q "<skipped" test-reports/e2e.junit.xml; then
            echo "::error::an E2E testcase was skipped in test-reports/e2e.junit.xml"
            exit 1
          fi
          echo "E2E 1, E2E 2, E2E 3, E2E 4 present and none skipped"

      - name: Upload test reports
        if: '!cancelled()'
        uses: actions/upload-artifact@v4
        with:
          name: integration-e2e-reports
          path: test-reports/
          if-no-files-found: warn
          retention-days: 14

      # Testcontainers' reaper normally removes its containers; this covers a runner where
      # the job was killed before the suite's `afterAll` or the reaper ran.
      - name: Remove leftover Testcontainers
        if: always()
        run: |
          ids="$(docker ps -aq --filter label=org.testcontainers=true)"
          if [ -n "$ids" ]; then docker rm -fv $ids; fi

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dashboard.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the whole stack starts, not just that the images build. The API's
      # healthcheck is gated on a reachable database, so a healthy API here means
      # API-to-PostgreSQL connectivity actually works.
      - name: Start the stack and wait for health
        run: |
          cp .env.example .env
          docker compose up -d --wait --wait-timeout 180
          docker compose ps
          curl -fsS http://localhost:3001/health
          curl -fsS -o /dev/null http://localhost:3000/

      - name: Collect compose logs on failure
        if: failure()
        run: |
          mkdir -p docker-logs
          docker compose ps -a > docker-logs/ps.txt || true
          docker compose logs --no-color > docker-logs/compose.log || true
          tail -n 200 docker-logs/compose.log

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-logs
          path: docker-logs/
          if-no-files-found: warn
          retention-days: 14

      # Removes the containers, network and volumes this job created.
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
